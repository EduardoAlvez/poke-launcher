<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Poke Launcher</title>
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <header id="toolbar">
    <span class="brand">Poke<span>Launcher</span></span>
    <div id="chips"></div>
    <button id="add" title="Nova sessão">+</button>
    <form id="add-form" hidden>
      <input id="add-name" placeholder="Nome" maxlength="24" required />
      <input id="add-url" placeholder="https://pokeidle.io/app" value="https://pokeidle.io/app" />
      <button type="submit" class="ok">OK</button>
      <button type="button" id="add-cancel">×</button>
      <span id="add-error" class="error"></span>
    </form>
    <div id="layout-btns">
      <button data-cols="1" title="1 coluna">▯</button>
      <button data-cols="2" class="active" title="2 colunas">▯▯</button>
      <button data-cols="3" title="3 colunas">▯▯▯</button>
    </div>
    <button id="stop-all" class="danger" hidden title="Parar todas as automacoes">Parar automações</button>
    <button id="close-popups" class="danger" hidden>Fechar popup de login (Esc)</button>
    <span id="diag-status" class="muted"></span>
    <button id="hunt-btn" title="Painel de caça: o que falta capturar na área">Caça</button>
    <button id="scripts-btn" title="UserScripts por sessão">Scripts</button>
    <button id="diagnostics" title="Salva um relatorio dos seletores da pagina (sem dados da conta)">Diagnóstico</button>
  </header>

  <div id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Automação de lançamentos</h2>
      <p id="modal-slot" class="muted"></p>
      <p id="modal-risk" class="risk"></p>
      <label class="check">
        <input type="checkbox" id="modal-consent" />
        <span>Entendo o risco e autorizo a automação nesta conta</span>
      </label>
      <label class="check">
        <input type="checkbox" id="modal-exit-eco" />
        <span>Sair do Modo Economia enquanto ativar (sem a cena não há alvo para lançar)</span>
      </label>
      <div class="grid">
        <label>Modo
          <select id="modal-mode">
            <option value="fixed">Lançar em intervalo fixo</option>
            <option value="until-catch">Lançar até capturar</option>
          </select>
        </label>
        <label>Intervalo (ms)
          <input type="number" id="modal-interval" min="500" max="60000" step="100" />
        </label>
        <label>Jitter (ms)
          <input type="number" id="modal-jitter" min="0" max="5000" step="100" />
        </label>
        <label>Máx. por minuto
          <input type="number" id="modal-max" min="1" max="60" step="1" />
        </label>
      </div>
      <p id="modal-error" class="error"></p>
      <div class="actions">
        <button id="modal-cancel">Cancelar</button>
        <button id="modal-save" class="ok">Salvar</button>
      </div>
    </div>
  </div>

  <div id="scripts-modal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="scripts-title">
      <h2 id="scripts-title">UserScripts</h2>
      <p class="hint">Roda o código dentro da página de cada sessão ao carregar. Use para ler dados do jogo ou montar seu próprio painel.</p>
      <p id="scripts-warn" class="script-warn" hidden></p>
      <div id="scripts-list" class="script-list"></div>
      <div class="script-form">
        <div class="grid">
          <label>Nome
            <input id="script-name" maxlength="40" placeholder="Leitor de XP" />
          </label>
          <label>Escopo
            <select id="script-mode">
              <option value="all">Todas as sessões</option>
              <option value="slots">Sessões específicas</option>
            </select>
          </label>
        </div>
        <div id="script-slots" class="script-slots" hidden></div>
        <label class="check">
          <input type="checkbox" id="script-enabled" checked />
          <span>Ativo (injeta ao carregar a página)</span>
        </label>
        <label class="script-code-label">Código
          <textarea id="script-code" spellcheck="false" placeholder="// roda no mundo da página do jogo&#10;console.log('olá');"></textarea>
        </label>
      </div>
      <p id="script-error" class="error"></p>
      <div class="actions">
        <button id="script-new">Novo</button>
        <button id="script-run-now">Rodar agora</button>
        <button id="scripts-close">Fechar</button>
        <button id="script-save" class="ok">Salvar</button>
      </div>
    </div>
  </div>

  <div id="hunt-modal" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="hunt-title">
      <h2 id="hunt-title">Painel de caça</h2>
      <p id="hunt-info" class="muted"></p>

      <div class="grid">
        <label>Sessão
          <select id="hunt-slot"></select>
        </label>
        <label>Ordem da rota
          <select id="route-ordem">
            <option value="facil">mais fácil primeiro (nv baixo)</option>
            <option value="xp">mais XP primeiro</option>
            <option value="regiao">por região</option>
          </select>
        </label>
        <label>Máx. alvos
          <input type="number" id="route-max" min="1" max="500" step="1" value="3" />
        </label>
      </div>

      <label class="check">
        <input type="checkbox" id="hunt-enable" />
        <span>Ler a dex desta sessão</span>
      </label>
      <label class="check">
        <input type="checkbox" id="hunt-levelcap" checked />
        <span>Só até meu nível <span id="hunt-levelcap-nv" class="muted"></span></span>
      </label>

      <p id="route-risk" class="risk"></p>
      <label class="check">
        <input type="checkbox" id="route-ack" />
        <span>Entendo o risco e autorizo a rota nesta conta</span>
      </label>

      <p id="hunt-status" class="info" hidden></p>

      <div id="hunt-body" hidden>
        <p id="hunt-area" class="hunt-area"></p>
        <div class="hunt-cols">
          <div>
            <h3>Faltam para capturar <span id="hunt-missing-count" class="muted"></span></h3>
            <ul id="hunt-missing" class="hunt-list"></ul>
          </div>
          <div>
            <h3>Disponíveis nesta área</h3>
            <ul id="hunt-area-list" class="hunt-list"></ul>
          </div>
        </div>
        <p id="hunt-progress" class="info"></p>
        <p id="route-status" class="info" hidden></p>
        <p id="p2-status" class="info" hidden></p>
      </div>

      <h3>Arremessar no Economia (P2)</h3>
      <p id="p2-risk" class="risk"></p>
      <label class="check">
        <input type="checkbox" id="p2-ack" />
        <span>Entendo o risco e autorizo o P2 nesta execução</span>
      </label>
      <label>Máx. arremessos
        <input type="number" id="p2-max" min="1" max="500" step="1" value="30" />
      </label>
      <p id="p2-msg" class="msg" hidden></p>

      <p id="hunt-error" class="error" hidden></p>
      <p id="route-msg" class="msg" hidden></p>

      <div class="actions">
        <button id="p2-stop" class="danger" hidden>Desarmar P2</button>
        <button id="route-stop" class="danger" hidden>Parar rota</button>
        <button id="hunt-refresh">Atualizar</button>
        <button id="hunt-close">Fechar</button>
        <button id="p2-start" class="ok" disabled>Arremessar no Economia</button>
        <button id="route-start" class="ok" disabled>Capturar um por um</button>
      </div>
    </div>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
