<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Poke Launcher</title>
  <link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <header id="toolbar">
    <span class="brand">Poke<span>Launcher</span></span>
    <div id="chips"></div>
    <button id="add" title="Nova sessão">+</button>
    <form id="add-form" hidden>
      <input id="add-name" placeholder="Nome" maxlength="24" required />
      <input id="add-url" placeholder="https://pokeidle.io/app" value="https://pokeidle.io/app" />
      <button type="submit" class="ok">OK</button>
      <button type="button" id="add-cancel">×</button>
      <span id="add-error" class="error"></span>
    </form>
    <div id="layout-btns">
      <button data-cols="1" title="1 coluna">▯</button>
      <button data-cols="2" class="active" title="2 colunas">▯▯</button>
      <button data-cols="3" title="3 colunas">▯▯▯</button>
    </div>
    <button id="stop-all" class="danger" hidden title="Parar todas as automacoes">Parar automações</button>
  </header>

  <div id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Automação de lançamentos</h2>
      <p id="modal-slot" class="muted"></p>
      <p id="modal-risk" class="risk"></p>
      <label class="check">
        <input type="checkbox" id="modal-consent" />
        <span>Entendo o risco e autorizo a automação nesta conta</span>
      </label>
      <div class="grid">
        <label>Modo
          <select id="modal-mode">
            <option value="fixed">Lançar em intervalo fixo</option>
            <option value="until-catch">Lançar até capturar</option>
          </select>
        </label>
        <label>Intervalo (ms)
          <input type="number" id="modal-interval" min="500" max="60000" step="100" />
        </label>
        <label>Jitter (ms)
          <input type="number" id="modal-jitter" min="0" max="5000" step="100" />
        </label>
        <label>Máx. por minuto
          <input type="number" id="modal-max" min="1" max="60" step="1" />
        </label>
      </div>
      <p id="modal-error" class="error"></p>
      <div class="actions">
        <button id="modal-cancel">Cancelar</button>
        <button id="modal-save" class="ok">Salvar</button>
      </div>
    </div>
  </div>
  <script src="chrome.js"></script>
</body>
</html>
